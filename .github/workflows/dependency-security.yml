name: Dependency security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned runtime and development dependencies
        run: |
          python -m pip_audit -r requirements.txt --no-deps --disable-pip --strict
          python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip --strict
