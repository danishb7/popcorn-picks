[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popcorn-picks"
version = "0.1.0"
description = "A hybrid MovieLens recommender with a training CLI and Streamlit app."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "scikit-surprise==1.1.4",
    "streamlit>=1.54,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
    "pip-audit>=2.9,<3",
    "pip-tools>=7.5,<8",
]

[project.scripts]
popcorn-picks = "popcorn_picks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
